[package]
name = "ardin-core"
version = "0.1.0"
edition = "2021"
[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-str"] }
chrono = { version = "0.4", features = ["serde"] }
[dev-dependencies]
tempfile = "3"
